stages:
  download:
    cmd: python src/download.py
    deps:
      - src/download.py
    outs:
      - data/raw

  prepare_train:
    cmd: python src/prepare_train.py
    deps:
      - src/prepare_train.py
      - src/common.py
      - data/raw
    params:
      - prepare
    outs:
      - data/prepared/train.pt
      - data/prepared/val.pt

  prepare_test:
    cmd: python src/prepare_test.py
    deps:
      - src/prepare_test.py
      - src/common.py
      - data/raw
    outs:
      - data/prepared/test.pt

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - src/model.py
      - src/common.py
      - data/prepared/train.pt
      - data/prepared/val.pt
    params:
      - training.config
      - ${training.config}:
          - model
          - train
    outs:
      - models/model.pt
    metrics:
      - metrics/train.json:
          cache: false
    plots:
      - plots/train_history.csv:
          cache: false
          x: epoch

  predict:
    cmd: python src/predict.py
    deps:
      - src/predict.py
      - src/model.py
      - src/common.py
      - models/model.pt
      - data/prepared/test.pt
    params:
      - predict
    outs:
      - predictions/test.csv

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - predictions/test.csv
    metrics:
      - metrics/eval.json:
          cache: false
    plots:
      - plots/confusion.csv:
          cache: false
          template: confusion
          x: predicted
          y: actual

plots:
  - Courbes d'apprentissage:
      x: epoch
      y:
        plots/train_history.csv: [train_loss, val_loss]
  - Accuracy validation:
      x: epoch
      y:
        plots/train_history.csv: val_acc
