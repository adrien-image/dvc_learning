stages:
  download_mnist:
    cmd: python src/download.py mnist
    deps:
      - src/download.py
    outs:
      - data/raw/MNIST

  download_qmnist:
    cmd: python src/download.py qmnist
    deps:
      - src/download.py
    outs:
      - data/raw/QMNIST

  prepare_train:
    cmd: python src/prepare_train.py
    deps:
      - src/prepare_train.py
      - src/common.py
      - data/raw/MNIST
    params:
      - prepare
    outs:
      - data/prepared/train.pt
      - data/prepared/val.pt

  prepare_test:
    cmd: python src/prepare_test.py
    deps:
      - src/prepare_test.py
      - src/common.py
      - data/raw/MNIST
    outs:
      - data/prepared/test.pt

  prepare_test_qmnist:
    cmd: python src/prepare_test_qmnist.py
    deps:
      - src/prepare_test_qmnist.py
      - src/common.py
      - data/raw/QMNIST
    outs:
      - data/prepared/test_qmnist.pt

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - src/model.py
      - src/common.py
      - data/prepared/train.pt
      - data/prepared/val.pt
    params:
      - training.config
      - ${training.config}:
          - model
          - train
    outs:
      - models/model.pt
    metrics:
      - metrics/train.json:
          cache: false
    plots:
      - plots/train_history.csv:
          cache: false
          x: epoch

  # Une prédiction par test set : stages predict@test et predict@test_qmnist
  predict:
    foreach:
      - test
      - test_qmnist
    do:
      cmd: python src/predict.py --split ${item}
      deps:
        - src/predict.py
        - src/model.py
        - src/common.py
        - models/model.pt
        - data/prepared/${item}.pt
      params:
        - predict
      outs:
        - predictions/${item}.csv

  evaluate:
    cmd: python src/evaluate.py test test_qmnist
    deps:
      - src/evaluate.py
      - predictions/test.csv
      - predictions/test_qmnist.csv
    metrics:
      - metrics/eval.json:
          cache: false
    plots:
      - plots/confusion_test.csv:
          cache: false
          template: confusion
          x: predicted
          y: actual
      - plots/confusion_test_qmnist.csv:
          cache: false
          template: confusion
          x: predicted
          y: actual

plots:
  - Courbes d'apprentissage:
      x: epoch
      y:
        plots/train_history.csv: [train_loss, val_loss]
  - Accuracy validation:
      x: epoch
      y:
        plots/train_history.csv: val_acc
